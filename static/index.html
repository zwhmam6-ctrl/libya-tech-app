<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>تقنية ليبية — مساعدك الذكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-void: #0b0e14;
    --bg-panel: #12161f;
    --bg-elevated: #1a1f2c;
    --bg-hover: #212736;
    --sand: #d4a054;
    --sand-dim: #8a6a3d;
    --oasis: #3a9188;
    --text-primary: #eef0f4;
    --text-secondary: #8b93a7;
    --text-faint: #565f75;
    --border: #232939;
    --danger: #d16464;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Tajawal', sans-serif;
    background: var(--bg-void);
    color: var(--text-primary);
    overflow: hidden;
  }

  body {
    display: flex;
    height: 100vh;
  }

  /* ===== Sidebar ===== */
  #sidebar {
    width: 280px;
    flex-shrink: 0;
    background: var(--bg-panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: margin-right 0.25s ease;
  }

  #sidebar.collapsed {
    margin-right: -280px;
  }

  .sidebar-header {
    padding: 20px 18px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
  }

  .logo-mark {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--sand), var(--sand-dim));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 18px;
    color: var(--bg-void);
    flex-shrink: 0;
  }

  .logo-text {
    font-weight: 900;
    font-size: 18px;
    letter-spacing: 0.3px;
  }

  .logo-sub {
    font-size: 11px;
    color: var(--text-faint);
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.5px;
  }

  #newChatBtn {
    margin: 14px;
    padding: 11px 14px;
    background: transparent;
    border: 1px solid var(--sand-dim);
    color: var(--sand);
    border-radius: 10px;
    font-family: 'Tajawal', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s;
  }
  #newChatBtn:hover {
    background: rgba(212, 160, 84, 0.08);
    border-color: var(--sand);
  }

  #convList {
    flex: 1;
    overflow-y: auto;
    padding: 4px 10px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .conv-item {
    padding: 10px 12px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 13.5px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    position: relative;
  }
  .conv-item:hover { background: var(--bg-hover); color: var(--text-primary); }
  .conv-item.active {
    background: var(--bg-elevated);
    color: var(--text-primary);
    box-shadow: inset 3px 0 0 var(--sand);
  }
  .conv-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-delete {
    opacity: 0;
    background: none;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    font-size: 15px;
    padding: 2px 5px;
    border-radius: 5px;
    flex-shrink: 0;
  }
  .conv-item:hover .conv-delete { opacity: 1; }
  .conv-delete:hover { color: var(--danger); background: rgba(209,100,100,0.1); }

  .sidebar-footer {
    padding: 14px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-faint);
    font-family: 'IBM Plex Mono', monospace;
    text-align: center;
  }

  /* ===== Main ===== */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    position: relative;
  }

  #topbar {
    height: 58px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
  }

  #toggleSidebar {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }
  #toggleSidebar:hover { background: var(--bg-hover); color: var(--text-primary); }

  #topbarTitle {
    font-weight: 700;
    font-size: 15px;
    color: var(--text-secondary);
  }

  #chatScroll {
    flex: 1;
    overflow-y: auto;
    display: flex;
    justify-content: center;
  }

  #chatInner {
    width: 100%;
    max-width: 760px;
    padding: 30px 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  /* Empty state */
  #emptyState {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 18px;
    padding: 40px 20px;
  }

  #emptyState .glyph {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--sand), var(--oasis));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: 900;
    color: var(--bg-void);
  }
  #emptyState h1 { font-size: 24px; font-weight: 900; }
  #emptyState p { color: var(--text-secondary); font-size: 14.5px; max-width: 340px; line-height: 1.7; }

  .suggestions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 8px;
    width: 100%;
    max-width: 480px;
  }
  .suggestion-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 15px;
    text-align: right;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-secondary);
    transition: border-color 0.15s, color 0.15s;
  }
  .suggestion-card:hover { border-color: var(--sand-dim); color: var(--text-primary); }

  /* Messages */
  .row { display: flex; gap: 12px; align-items: flex-start; }
  .row.user { flex-direction: row-reverse; }

  .avatar {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 900;
    margin-top: 2px;
  }
  .avatar.bot { background: linear-gradient(135deg, var(--sand), var(--oasis)); color: var(--bg-void); }
  .avatar.user { background: var(--bg-elevated); color: var(--text-secondary); border: 1px solid var(--border); }

  .bubble {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.85;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.user .bubble {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }
  .row.bot .bubble {
    background: transparent;
    padding: 6px 0;
    color: var(--text-primary);
  }

  .typing-dots { display: flex; gap: 4px; padding: 10px 0; }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--sand);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* Input */
  #inputWrap {
    padding: 16px 24px 22px;
    display: flex;
    justify-content: center;
  }
  #inputBox {
    width: 100%;
    max-width: 760px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 10px 10px 10px 10px;
    transition: border-color 0.15s;
  }
  #inputBox:focus-within { border-color: var(--sand-dim); }

  #userInput {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-family: 'Tajawal', sans-serif;
    font-size: 15px;
    resize: none;
    max-height: 160px;
    padding: 8px 6px;
    line-height: 1.6;
  }
  #userInput::placeholder { color: var(--text-faint); }

  #sendBtn {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    border: none;
    background: var(--sand);
    color: var(--bg-void);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
    font-size: 16px;
  }
  #sendBtn:hover { background: #e0ae64; }
  #sendBtn:active { transform: scale(0.93); }
  #sendBtn:disabled { background: var(--bg-elevated); color: var(--text-faint); cursor: not-allowed; }

  .hint {
    text-align: center;
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 10px;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--bg-elevated); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--bg-hover); }

  /* Mobile */
  @media (max-width: 720px) {
    #sidebar {
      position: fixed;
      z-index: 20;
      height: 100%;
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }
    #sidebar.collapsed { margin-right: -280px; }
    #sidebar:not(.collapsed) { margin-right: 0; }
    .suggestions { grid-template-columns: 1fr; }
    .bubble { max-width: 88%; }
  }

  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 15;
  }
  #overlay.show { display: block; }
</style>
</head>
<body>

<div id="overlay"></div>

<aside id="sidebar">
  <div class="sidebar-header">
    <div class="logo-mark">ل</div>
    <div>
      <div class="logo-text">تقنية ليبية</div>
      <div class="logo-sub">AI ASSISTANT</div>
    </div>
  </div>

  <button id="newChatBtn">
    <span>＋</span>
    <span>محادثة جديدة</span>
  </button>

  <div id="convList"></div>

  <div class="sidebar-footer">تقنية ليبية · مبني على Qwen 2.5</div>
</aside>

<main id="main">
  <div id="topbar">
    <button id="toggleSidebar">☰</button>
    <div id="topbarTitle">محادثة جديدة</div>
  </div>

  <div id="chatScroll">
    <div id="chatInner">
      <div id="emptyState">
        <div class="glyph">ل</div>
        <h1>أهلاً بك في تقنية ليبية</h1>
        <p>مساعدك الذكي الناطق بالعربية. اسألني أي شيء، أو اختر أحد الاقتراحات للبدء.</p>
        <div class="suggestions">
          <div class="suggestion-card" data-q="اقترح علي خطة لتنظيم يومي بشكل أفضل">📅 خطة لتنظيم يومي</div>
          <div class="suggestion-card" data-q="اشرح لي فكرة الذكاء الاصطناعي بطريقة مبسطة">🧠 اشرح الذكاء الاصطناعي</div>
          <div class="suggestion-card" data-q="اكتب لي رسالة اعتذار مهذبة لصديق">✉️ اكتب رسالة</div>
          <div class="suggestion-card" data-q="أعطني خمس أفكار لمشروع صغير مربح">💡 أفكار مشاريع</div>
        </div>
      </div>
    </div>
  </div>

  <div id="inputWrap">
    <div style="width:100%; max-width:760px;">
      <div id="inputBox">
        <textarea id="userInput" placeholder="اكتب رسالتك هنا..." rows="1"></textarea>
        <button id="sendBtn">➤</button>
      </div>
      <div class="hint">قد يخطئ المساعد أحياناً. تحقق من المعلومات المهمة.</div>
    </div>
  </div>
</main>

<script>
const STORAGE_KEY = 'libya_tech_conversations_v1';
let conversations = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
let activeId = null;

const convList = document.getElementById('convList');
const chatInner = document.getElementById('chatInner');
const emptyState = document.getElementById('emptyState');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const topbarTitle = document.getElementById('topbarTitle');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');

function saveConversations() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
}

function createConversation() {
  const id = 'c_' + Date.now();
  conversations[id] = { title: 'محادثة جديدة', messages: [] };
  activeId = id;
  saveConversations();
  renderSidebar();
  renderChat();
}

function deleteConversation(id, e) {
  e.stopPropagation();
  delete conversations[id];
  if (activeId === id) {
    const ids = Object.keys(conversations);
    activeId = ids.length ? ids[ids.length - 1] : null;
  }
  saveConversations();
  renderSidebar();
  renderChat();
}

function renderSidebar() {
  convList.innerHTML = '';
  const ids = Object.keys(conversations).sort((a, b) => b.localeCompare(a));
  ids.forEach(id => {
    const conv = conversations[id];
    const item = document.createElement('div');
    item.className = 'conv-item' + (id === activeId ? ' active' : '');
    item.innerHTML = `<span class="conv-title">${escapeHtml(conv.title)}</span><button class="conv-delete">✕</button>`;
    item.addEventListener('click', () => { activeId = id; renderSidebar(); renderChat(); closeSidebarMobile(); });
    item.querySelector('.conv-delete').addEventListener('click', (e) => deleteConversation(id, e));
    convList.appendChild(item);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderChat() {
  chatInner.innerHTML = '';
  if (!activeId || !conversations[activeId] || conversations[activeId].messages.length === 0) {
    chatInner.appendChild(emptyState);
    topbarTitle.textContent = 'محادثة جديدة';
    return;
  }
  const conv = conversations[activeId];
  topbarTitle.textContent = conv.title;
  conv.messages.forEach(msg => addMessageEl(msg.role, msg.content));
  scrollToBottom();
}

function addMessageEl(role, content) {
  const row = document.createElement('div');
  row.className = 'row ' + (role === 'user' ? 'user' : 'bot');
  const avatar = document.createElement('div');
  avatar.className = 'avatar ' + (role === 'user' ? 'user' : 'bot');
  avatar.textContent = role === 'user' ? 'أ' : 'ل';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;
  row.appendChild(avatar);
  row.appendChild(bubble);
  chatInner.appendChild(row);
  return bubble;
}

function scrollToBottom() {
  const scroll = document.getElementById('chatScroll');
  scroll.scrollTop = scroll.scrollHeight;
}

function autoResize() {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
}

async function sendMessage(text) {
  text = (text || userInput.value).trim();
  if (!text) return;

  if (!activeId) createConversation();
  const conv = conversations[activeId];

  if (conv.messages.length === 0) {
    conv.title = text.slice(0, 30) + (text.length > 30 ? '…' : '');
  }

  conv.messages.push({ role: 'user', content: text });
  saveConversations();
  renderSidebar();
  renderChat();

  userInput.value = '';
  autoResize();
  sendBtn.disabled = true;

  const typingRow = document.createElement('div');
  typingRow.className = 'row bot';
  typingRow.innerHTML = `<div class="avatar bot">ل</div><div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  chatInner.appendChild(typingRow);
  scrollToBottom();

  try {
    const history = conv.messages
      .slice(0, -1)
      .map(m => ({ role: m.role, content: m.content }));

    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history })
    });
    const data = await res.json();

    typingRow.remove();
    conv.messages.push({ role: 'assistant', content: data.reply });
    saveConversations();
    renderChat();
  } catch (err) {
    typingRow.remove();
    conv.messages.push({ role: 'assistant', content: 'تعذر الاتصال بالخادم. تأكد من تشغيله وحاول مجدداً.' });
    saveConversations();
    renderChat();
  }

  sendBtn.disabled = false;
  userInput.focus();
}

sendBtn.addEventListener('click', () => sendMessage());
userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
userInput.addEventListener('input', autoResize);

document.getElementById('newChatBtn').addEventListener('click', () => { createConversation(); closeSidebarMobile(); });

document.querySelectorAll('.suggestion-card').forEach(card => {
  card.addEventListener('click', () => sendMessage(card.dataset.q));
});

document.getElementById('toggleSidebar').addEventListener('click', () => {
  sidebar.classList.toggle('collapsed');
  overlay.classList.toggle('show', !sidebar.classList.contains('collapsed') && window.innerWidth <= 720);
});
overlay.addEventListener('click', closeSidebarMobile);
function closeSidebarMobile() {
  if (window.innerWidth <= 720) {
    sidebar.classList.add('collapsed');
    overlay.classList.remove('show');
  }
}

// Init
if (window.innerWidth <= 720) sidebar.classList.add('collapsed');
const existingIds = Object.keys(conversations);
if (existingIds.length > 0) {
  activeId = existingIds.sort((a, b) => b.localeCompare(a))[0];
}
renderSidebar();
renderChat();
</script>

</body>
</html>
